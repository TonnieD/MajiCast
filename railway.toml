[build]
# Use the backend Dockerfile at the repo root
dockerfilePath = "Dockerfile.backend"
watchPatterns = ["inference/**", "app/models/**", "Dockerfile.backend"]

[deploy]
# Railway injects $PORT — uvicorn must bind to it
startCommand = "uvicorn inference.main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
